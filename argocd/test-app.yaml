apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spike-test-app
  namespace: argocd
spec:
  generators:
    - clusters: {} # This targets ALL clusters connected to ArgoCD
  goTemplate: true
  template:
    metadata:
      name: 'spike-test-{{ index .metadata.labels "cluster-name" }}'
    spec:
      destination:
        namespace: default
        server: '{{ .server }}'
      project: default
      sources:
        - repoURL: https://charts.bitnami.com/bitnami
          chart: nginx
          targetRevision: 15.x.x # Pinning version as per KB
          helm:
            releaseName: spike-test
      syncPolicy:
        automated:
          prune: true
          selfHeal: true